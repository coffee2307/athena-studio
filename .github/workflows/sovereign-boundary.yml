name: Sovereign template boundary
on:
  pull_request:
    paths:
      - "app/template-demos/**"
      - "components/sovereign/**"
      - "data/sovereign-site-registry.ts"
      - "templates/**"
      - "scripts/sovereign-*.mjs"
      - "scripts/create-site.mjs"
      - "public/template-previews/**"
      - "tests/sovereign-*.test.mjs"
      - "tests/dna03-template-projects.test.mjs"
      - ".github/workflows/sovereign-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sovereign-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sovereign architecture and legacy debt baseline
        run: node scripts/sovereign-audit.mjs --check --out=.qa/athena-21-sovereign/audit.json
      - name: Route, framework and standalone export contracts
        run: node --test tests/sovereign-boundary.test.mjs tests/sovereign-export-fidelity.test.mjs tests/dna03-template-projects.test.mjs
      - name: Install Digital Creators standalone dependencies
        run: npm ci --prefix templates/digital-creators --no-audit --no-fund
      - name: Compile the native Vite/React/Three.js export
        run: npm run build --prefix templates/digital-creators
      - name: Confirm Digital Creators source fidelity after build
        run: node scripts/sovereign-digital-creators-sync.mjs --check
      - name: Publish audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-p4-source-audit
          path: .qa/athena-21-sovereign/audit.json
          if-no-files-found: ignore
