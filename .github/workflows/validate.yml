name: Athena validation

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, unit, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: HTTP smoke tests
        run: npm run test:smoke
      - name: Production security audit
        run: npm run audit:runtime

  browser-quality:
    name: Browser E2E and automated accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install supported browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Build production
        run: npm run build
      - name: Playwright scenarios and axe checks
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: athena-browser-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
