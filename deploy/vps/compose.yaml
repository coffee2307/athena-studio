# PHASE 8C.4: Candidate for modest Ubuntu VPS. NOT DEPLOYED.
name: athena-studio
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: athena_identity
      POSTGRES_PASSWORD_FILE: /run/secrets/athena_pg_admin_password
    command: ["postgres","-c","max_connections=30","-c","shared_buffers=128MB","-c","work_mem=4MB","-c","maintenance_work_mem=32MB","-c","max_wal_size=512MB","-c","password_encryption=scram-sha-256"]
    secrets: [athena_pg_admin_password,athena_pg_password]
    # Bind-mounted file secrets: non-root containers must be able to READ them.
    # Operator locks the host secrets DIRECTORY to root:root 0700.
    volumes:
      - identity_db:/var/lib/postgresql/data
      - ./init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d athena_identity"]
      interval: 10s
      timeout: 3s
      retries: 8
    mem_limit: 448m
    cpus: "0.75"
    pids_limit: 100
    shm_size: 64m
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  web:
    image: ${ATHENA_WEB_IMAGE:?Supply a reviewed image tag or digest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: ${ATHENA_SITE_ORIGIN:?Set exact HTTPS origin}
      NEXT_PUBLIC_ATHENA_AUTH_ENABLED: "false"
      NEXT_PUBLIC_ATHENA_GOOGLE_ENABLED: "false"
      ATHENA_INDEPENDENT_AUTH_ENABLED: "false"
      ATHENA_OPERATIONS_ENABLED: "false"
      ATHENA_SITEPULSE_ENABLED: "false"
      ATHENA_VPS_IDENTITY_ENABLED: ${ATHENA_VPS_IDENTITY_ENABLED:-false}
      ATHENA_VPS_RELEASE_APPROVED: ${ATHENA_VPS_RELEASE_APPROVED:-false}
      ATHENA_VPS_AUTH_ORIGIN: ${ATHENA_SITE_ORIGIN:?Set exact HTTPS origin}
      ATHENA_VPS_PG_HOST: postgres
      ATHENA_VPS_PG_PORT: "5432"
      ATHENA_VPS_PG_DATABASE: athena_identity
      ATHENA_VPS_PG_USER: athena_app
      ATHENA_VPS_PG_PASSWORD_FILE: /run/secrets/athena_pg_password
      BETTER_AUTH_SECRET_FILE: /run/secrets/athena_auth_secret
      ATHENA_GMAIL_SENDER_ENABLED: "false"
    secrets: [athena_pg_password,athena_auth_secret]
    volumes: [next_cache:/app/.next/cache]
    read_only: true
    tmpfs: [/tmp]
    networks: [backend,edge]
    mem_limit: 896m
    cpus: "1.25"
    pids_limit: 120
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      ATHENA_DOMAIN: ${ATHENA_DOMAIN:?Set an approved domain}
      ATHENA_TLS_EMAIL: ${ATHENA_TLS_EMAIL:?Set certificate contact email}
    ports: ["80:80","443:443","443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    networks: [edge]
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 50
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  backend:
    internal: true
  edge: {}

volumes:
  identity_db: {}
  next_cache: {}
  caddy_data: {}
  caddy_config: {}

secrets:
  athena_pg_admin_password:
    file: ./secrets/athena_pg_admin_password
  athena_pg_password:
    file: ./secrets/athena_pg_password
  athena_auth_secret:
    file: ./secrets/athena_auth_secret
