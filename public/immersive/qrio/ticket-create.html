<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Qrio — Chức năng vé cần máy chủ</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 75% 20%,#2e1c61 0,transparent 44%),#0f0f1a;color:#f7f4ff;font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;padding:25px}
    main{max-width:620px;padding:45px;border:1px solid #3f3261;background:#171426;border-radius:23px;box-shadow:0 30px 100px #0005}
    .brand{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:850;margin-bottom:36px;letter-spacing:-.03em}
    .icon{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:linear-gradient(130deg,#6946de,#893df1);color:#fff}
    h1{font-size:clamp(32px,6vw,45px);line-height:1.15;letter-spacing:-.045em;margin:0 0 22px}
    p{color:#b8b4c9;line-height:1.9;font-size:15px;margin:0 0 27px}
    a{display:inline-flex;background:#6946de;color:#fff;border-radius:12px;text-decoration:none;font-weight:750;padding:13px 20px}
    a:focus-visible{outline:3px solid #bcb1ff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="icon">Q</span>Qrio</div>
    <h1>Chức năng vé đang ở hệ thống Qrio gốc</h1>
    <p>Bản trình diễn trên Athena giữ giao diện Qrio nhưng không kết nối máy chủ, đơn hàng, hệ thống vé hay thanh toán. Vui lòng quay lại để trải nghiệm trình chỉnh sửa QR.</p>
    <a href="./index.html">Trở về Qrio</a>
  </main>
</body>
</html>
